[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vorn"
version = "0.2.3"
description = "Experimental duplex-sponge AEAD with an ARX permutation and prime-hopping constants. Research use only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LowLeery" }]
keywords = ["cryptography", "aead", "sponge", "cipher", "arx", "experimental"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/LowLeery/vorn"
Repository = "https://github.com/LowLeery/vorn"

[tool.setuptools]
packages = ["vorn"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
